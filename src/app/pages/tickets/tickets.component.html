<section class="tickets-page-section py-5 bg-dark text-white">
  <div class="container">
    <h2 class="section-title text-center text-gold mb-5">All Tickets</h2>

    <div class="row g-4">
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3"
        *ngFor="let ticket of tickets"
      >
        <div class="ticket-card position-relative overflow-hidden">
          <div class="ticket-img-wrapper">
            <img
              [src]="ticket.image"
              [alt]="ticket.title"
              class="ticket-img w-100"
            />
            <div class="ticket-overlay d-flex flex-column justify-content-end p-3">
              <h5 class="text-gold mb-2">{{ ticket.title }}</h5>
              <p class="small mb-3">{{ ticket.description }}</p>
              <a
                [routerLink]="['/contact']"
                [queryParams]="{ ticket: ticket.title }"
                class="btn btn-gold fw-semibold border-gold"
              >
                Get Enquiry
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
