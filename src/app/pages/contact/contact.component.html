<!-- Hero Section -->
<section class="hero-contact position-relative text-center text-white d-flex align-items-center" 
         style="background: url('https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600') center/cover no-repeat; min-height: 40vh;">
  <div class="overlay w-100 h-100 position-absolute" style="background-color: rgba(0,0,0,0.6);"></div>
  <div class="position-relative px-3 container" data-aos="fade-up">
    <h1 class="display-5 fw-bold " style="color: #d4af37;">Contact Us</h1>
    <p class="lead">Let’s build your dream project together</p>
  </div>
</section>

<!-- Contact Section -->
<section class="container py-5">
  <div class="row g-4">
    <!-- Contact Form -->
    <div class="col-md-6" data-aos="fade-right">
      <div class="card shadow-sm border-0 hover-shadow">
        <div class="card-body">
          <h2 class="h4 fw-bold mb-4" style="color: #d4af37;">Get in Touch</h2>
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Your Name</label>
              <input type="text" formControlName="name" class="form-control" />
              <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="text-danger small mt-1">
                Name is required.
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" formControlName="email" class="form-control" />
              <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="text-danger small mt-1">
                Enter a valid email.
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" formControlName="phone" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea rows="4" formControlName="message" class="form-control"></textarea>
            </div>
            <button type="submit" [disabled]="contactForm.invalid" class="btn btn-gold text-dark fw-semibold">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Office Info + Map -->
    <div class="col-md-6 d-flex flex-column gap-4">
      <div class="card shadow-sm border-0 hover-shadow" data-aos="fade-left">
        <div class="card-body">
          <h3 class="h5 fw-bold mb-3" style="color: #d4af37;">Our Office</h3>
          <p class="mb-1"><i class="fas fa-map-marker-alt me-2"></i>#720, Sector 41B, Chandigarh</p>
          <p class="mb-1"><i class="fas fa-envelope me-2"></i>geetakconstructions&#64;gmail.com</p>
          <p class="mb-1"><i class="fas fa-phone me-2"></i>+91 84377 95590</p>
          <p class="mb-0"><strong>GSTIN:</strong> 04BBSPC1208C12C</p>
        </div>
      </div>
      <div class="card shadow-sm border-0 overflow-hidden" data-aos="fade-up" data-aos-delay="200">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d857.3823312406593!2d76.74238984315248!3d30.731629773270424!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390fedd96445a645%3A0xee6b60486e110d97!2sSector%2041B%2C%20Sector%2041%2C%20Chandigarh%2C%20160036!5e0!3m2!1sen!2sin!4v1757354834687!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>
</section>
