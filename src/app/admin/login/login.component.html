<div class="login-wrapper d-flex justify-content-center align-items-center">
  <div class="login-box p-4">

    <h3 class="text-center mb-4 login-title">Welcome Back</h3>
    <p class="text-center text-light mb-4">Please login to access your dashboard</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label text-light">Email</label>
        <input 
          type="email" 
          class="form-control custom-input" 
          formControlName="email" 
          placeholder="Enter your email">
        <small class="text-danger" *ngIf="submitted && loginForm.controls['email'].errors">
          Valid email is required
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label text-light">Password</label>
        <input 
          type="password" 
          class="form-control custom-input" 
          formControlName="password" 
          placeholder="Enter your password">
        <small class="text-danger" *ngIf="submitted && loginForm.controls['password'].errors">
          Password is required
        </small>
      </div>

      <!-- Button -->
      <button class="btn-login w-100 mt-3" type="submit">
        Login
      </button>
    </form>

    <!-- Error Message -->
    <p class="text-danger text-center mt-3" *ngIf="loginError">{{ loginError }}</p>

  </div>
</div>
