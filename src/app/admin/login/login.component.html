<div class="login-wrapper d-flex justify-content-center align-items-center">
  <div class="login-box p-4">

    <h3 class="text-center mb-4 login-title">Welcome Back</h3>
    <p class="text-center text-light mb-4">Please login to access your dashboard</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label text-light">Email</label>
        <input 
          type="email" 
          class="form-control custom-input" 
          formControlName="email" 
          placeholder="Enter your email">
        <small class="text-danger" *ngIf="submitted && control('email')?.errors">
          <span *ngIf="control('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="control('email')?.errors?.['email']">Enter a valid email</span>
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label text-light">Password</label>
        <input 
          type="password" 
          class="form-control custom-input" 
          formControlName="password" 
          placeholder="Enter your password">
        <small class="text-danger" *ngIf="submitted && control('password')?.errors">
          <span *ngIf="control('password')?.errors?.['required']">Password is required</span>
        </small>
      </div>

      <!-- Button -->
      <button class="btn-login w-100 mt-3" type="submit">
        Login
      </button>
    </form>

  </div>
</div>
