<div class="admin-wrapper">

  <!-- HEADER -->
  <div class="topbar d-flex justify-content-between align-items-center">
    <h2 class="title">🎟️ Ticket Management</h2>

    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Logout
    </button>
  </div>

  <!-- ADD TICKET CARD -->
  <div class="card glass-card mb-5 p-4">
    <h4 class="section-title mb-4">Add New Ticket</h4>

    <div class="row g-4">

      <div class="col-md-4">
        <label class="form-label">Title</label>
        <input type="text" class="form-control custom-input" [(ngModel)]="newTicket.title">
      </div>

      <div class="col-md-4">
        <label class="form-label">Description</label>
        <input type="text" class="form-control custom-input" [(ngModel)]="newTicket.description">
      </div>

      <div class="col-md-4">
        <label class="form-label">Upload Image</label>
        <input type="file" class="form-control custom-input" (change)="onNewFileSelect($event)">
      </div>

      <!-- PREVIEW -->
      <div class="col-12 text-center" *ngIf="newImagePreview">
        <img [src]="newImagePreview" class="preview-img">
      </div>


      <div class="col-12 text-end">
        <button class="btn-save" (click)="addTicket()">+ Add Ticket</button>
      </div>

    </div>
  </div>

  <!-- TICKETS TABLE -->
  <div class="card glass-card p-4">
    <h4 class="section-title mb-4">All Tickets</h4>

    <div class="table-responsive">
      <table class="table custom-table align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Event Title</th>
            <th>Description</th>
            <th>Image</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let ticket of tickets">
            <td>{{ ticket.id }}</td>
            <td>{{ ticket.title }}</td>
            <td>{{ ticket.description }}</td>
            <td>
              <img [src]="ticket.image" class="table-img" alt="event">
            </td>
            <td class="text-end">
              <button class="btn-action edit me-2" data-bs-toggle="modal" data-bs-target="#editModal"
                (click)="selectTicket(ticket)">
                Edit
              </button>

              <button class="btn-action delete" (click)="deleteTicket(ticket)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- EDIT MODAL -->
  <div class="modal fade" id="editModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content modal-glass">

        <div class="modal-header border-0">
          <h5 class="modal-title">Edit Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="cancelEdit()"></button>
        </div>

        <div class="modal-body">
          <div class="row g-4">

            <div class="col-md-4">
              <label class="form-label">Title</label>
              <input type="text" class="form-control custom-input" [(ngModel)]="editingTicket!.title">
            </div>

            <div class="col-md-4">
              <label class="form-label">Description</label>
              <input type="text" class="form-control custom-input" [(ngModel)]="editingTicket!.description">
            </div>

            <div class="col-md-4">
              <label class="form-label">Upload New Image</label>
              <input type="file" class="form-control custom-input" (change)="onEditFileSelect($event)">
            </div>

            <!-- PREVIEW -->
            <div class="col-12 text-center" *ngIf="editImagePreview">
              <img [src]="editImagePreview" class="preview-img">
            </div>


          </div>
        </div>

        <div class="modal-footer border-0">
          <button class="btn-cancel" data-bs-dismiss="modal" (click)="cancelEdit()">Cancel</button>
          <button class="btn-update" data-bs-dismiss="modal" (click)="updateTicket()">Update</button>
        </div>

      </div>
    </div>
  </div>

</div>
